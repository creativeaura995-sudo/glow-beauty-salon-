<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Glow Admin Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #6c5ce7,
                    #8e44ad
                );

            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.25);
        }

        .logo {
            text-align: center;

            font-size: 42px;

            margin-bottom: 5px;
        }

        h1 {
            text-align: center;

            margin: 0;

            color: #222;
        }

        .subtitle {
            text-align: center;

            color: #777;

            margin-top: 8px;

            margin-bottom: 30px;
        }

        label {
            display: block;

            margin-top: 18px;

            margin-bottom: 7px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 14px;

            border: 1px solid #ccc;

            border-radius: 10px;

            font-size: 16px;

            outline: none;
        }

        input:focus {
            border-color: #6c5ce7;

            box-shadow:
                0 0 0 3px
                rgba(108, 92, 231, 0.12);
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #6c5ce7;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        #message {
            margin-top: 18px;

            text-align: center;

            font-weight: bold;

            min-height: 20px;
        }

    </style>

</head>


<body>


    <div class="login-box">


        <div class="logo">
            ✨
        </div>


        <h1>
            Glow Admin
        </h1>


        <p class="subtitle">
            Sign in to your dashboard 🔐
        </p>


        <form id="loginForm">


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter admin email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >


            <button type="submit">
                Login
            </button>


        </form>


        <div id="message"></div>


    </div>


    <script src="/login.js"></script>


</body>

</html>
